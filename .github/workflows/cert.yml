name: 인증서 발급·갱신

# car.geurumedi.co.kr · car1.geurumedi.co.kr **두 이름을 한 장**에 받아 이 저장소에 올린다.
#  · ★ B685) car = 메인폰(192.0.0.2) · car1 = 세컨폰(192.0.0.8). 둘 다 가비아 `_acme-challenge.<이름>` CNAME 이
#    같은 `_acme-challenge.geurumedi.dedyn.io` 로 위임돼 있어 TXT 두 값이 한 자리에 함께 들어간다.
#  · ⚠ 앱은 SAN 에 car 가 있는지만 본다 — 이름을 더해도 앱은 그대로 받아 간다.
#  · 검증은 DNS-01 — 가비아의 `_acme-challenge.car` CNAME 이 deSEC 으로 위임돼 있어
#    acme.sh 가 deSEC API 로 TXT 를 넣고 뺀다(가비아는 손대지 않는다).
#  · 깃허브 러너는 매번 새것이라 상태가 남지 않는다 → 돌 때마다 새로 발급한다.
#    ⚠ Let's Encrypt 는 **같은 이름 반복 발급이 7일에 5장**이므로 자주 돌리지 말 것.
#  · 키는 RSA 2048 — 앱의 인증서 읽기가 지금 RSA 전용이다(CertManager.parsePrivateKey).

on:
  schedule:
    - cron: "0 3 1 */2 *"      # 두 달에 한 번(1일 03:00 UTC)
  workflow_dispatch:            # 손으로도 돌릴 수 있다
  push:                         # ★ B685) 이 파일을 고치면 곧바로 새 이름으로 받는다
    branches: [main]
    paths: [".github/workflows/cert.yml"]

permissions:
  contents: write

concurrency:
  group: cert
  cancel-in-progress: false

env:
  DOMAIN: car.geurumedi.co.kr    # 주 이름(acme.sh 폴더 이름이기도 하다)
  DOMAIN2: car1.geurumedi.co.kr  # ★ B685) 세컨폰
  ALIAS: geurumedi.dedyn.io      # 검증 TXT 가 실제로 쓰이는 곳
  ACME_MAIL: kimys1124@gmail.com

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 위임이 제대로 걸렸는지 먼저 확인
        run: |
          set -e
          echo "· _acme-challenge.$DOMAIN 의 CNAME:"
          dig +short CNAME "_acme-challenge.$DOMAIN" | tee /tmp/cname.txt
          grep -q "_acme-challenge.$ALIAS" /tmp/cname.txt \
            || { echo "✗ 위임이 안 걸렸다 — 가비아의 CNAME 을 확인할 것"; exit 1; }
          echo "· $DOMAIN 의 A:"
          dig +short A "$DOMAIN"
          echo "· _acme-challenge.$DOMAIN2 의 CNAME:"
          dig +short CNAME "_acme-challenge.$DOMAIN2" | tee /tmp/cname2.txt
          grep -q "_acme-challenge.$ALIAS" /tmp/cname2.txt \
            || { echo "✗ $DOMAIN2 위임이 안 걸렸다 — 가비아의 CNAME 을 확인할 것"; exit 1; }
          echo "· $DOMAIN2 의 A:"
          dig +short A "$DOMAIN2"

      - name: acme.sh 설치
        run: |
          set -e
          curl -fsS https://get.acme.sh | sh -s email="$ACME_MAIL"

      # ★★★ B667) **검증 이름을 미리 만들어 둔다.** (2026-09-16 · 2차 실패)
      #   2차 오류: `During secondary validation: DNS problem: **NXDOMAIN** looking up TXT`
      #   — 1차의 DNSSEC Bogus 는 풀렸고, 이번엔 Let's Encrypt 의 **보조 검증 지점**이 그 이름을 「없다」로 봤다.
      #
      #   왜 — `_acme-challenge.geurumedi.dedyn.io` 는 acme.sh 가 넣기 전까지 **존재하지 않는 이름**이다.
      #   그 사이에 누가 한 번이라도 물으면 리졸버가 **「없다」를 negative TTL 만큼 캐시**한다.
      #   deSEC 의 SOA minimum 은 **3600(1시간)** 이라, 그 뒤에 TXT 를 넣어도 한 시간 동안 NXDOMAIN 이 돌아온다.
      #
      #   ⭕ 자리지킴 값을 하나 두면 그 이름이 **늘 존재**한다 → 「없다」가 캐시될 일이 없다.
      #   ⚠ acme.sh(dns_desec)는 검증이 끝나면 **자기 값만** 빼므로 이 자리지킴은 그대로 남는다.
      - name: 검증 이름을 미리 만들어 둔다(NXDOMAIN 캐시 막기)
        env:
          DEDYN_TOKEN: ${{ secrets.DESEC_TOKEN }}
        run: |
          set -e
          # ⚠ B667-2) deSEC 은 **없는 rrset 을 PUT 으로 못 만든다**(404 "No RRset matches the given query").
          #   새로 만들 때는 컬렉션에 **POST**, 이미 있으면 그 자리에 **PUT** 이다.
          #   TXT 값은 **DNS 표기 그대로**(따옴표를 포함한 문자열)라 JSON 을 파일로 만들어 보낸다
          #   — 셸 한 줄에 넣으면 따옴표가 세 겹이 되어 틀리기 쉽다.
          #   ⚠ heredoc 은 쓸 수 없다 — 종료 토큰이 줄 맨 앞이라야 하는데 YAML 블록은 거기서 끊긴다.
          printf %s '{"subname":"_acme-challenge","type":"TXT","ttl":3600,"records":["\"tm-cert placeholder\""]}' > /tmp/ph.json
          code=$(curl -sS -o /tmp/res.json -w "%{http_code}" -X POST \
            "https://desec.io/api/v1/domains/$ALIAS/rrsets/" \
            -H "Authorization: Token $DEDYN_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/ph.json)
          echo "· 자리지킴 POST → $code"; cat /tmp/res.json; echo
          if [ "$code" = "400" ] || [ "$code" = "409" ]; then
            echo "· 이미 있다 → 그 자리에 PUT"
            code=$(curl -sS -o /tmp/res.json -w "%{http_code}" -X PUT \
              "https://desec.io/api/v1/domains/$ALIAS/rrsets/_acme-challenge/TXT/" \
              -H "Authorization: Token $DEDYN_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/ph.json)
            echo "· 자리지킴 PUT → $code"; cat /tmp/res.json; echo
          fi
          case "$code" in 200|201) : ;; *) echo "✗ 자리지킴을 못 넣었다 — 토큰·도메인 이름을 확인할 것"; exit 1 ;; esac
          echo "· 60초 기다린 뒤 밖에서 보이는지 확인"
          sleep 60
          for r in 8.8.8.8 1.1.1.1 9.9.9.9; do
            echo -n "  $r → "; dig +short @"$r" TXT "_acme-challenge.$ALIAS" | tr "\n" " "; echo
          done
          echo -n "  CNAME 을 따라온 이름(8.8.8.8) → "; dig +short @8.8.8.8 TXT "_acme-challenge.$DOMAIN" | tr "\n" " "; echo

      - name: 인증서 발급
        env:
          DEDYN_TOKEN: ${{ secrets.DESEC_TOKEN }}   # deSEC 토큰(저장소 비밀)
        run: |
          set -e
          ~/.acme.sh/acme.sh --set-default-ca --server letsencrypt
          ~/.acme.sh/acme.sh --issue \
            --domain "$DOMAIN" --challenge-alias "$ALIAS" \
            --domain "$DOMAIN2" --challenge-alias "$ALIAS" \
            --dns dns_desec \
            --keylength 2048
          # ★ B685) 대리 검증 주소는 이름 순서대로 짝지어진다 — 이름마다 하나씩 준다
          # ★★★ B667) **`--dnssleep 60` 을 걷었다.**
          #   그 옵션은 「60초 자고 무조건 넘어간다」는 뜻이다 — 퍼졌는지는 보지 않는다.
          #   빼면 acme.sh 가 **공개 리졸버로 TXT 가 실제로 보이는지 확인한 뒤**에 검증을 요청한다.
          #   (§8 「고정 대기는 그 일이 끝났나를 안 본다」와 같은 자리다)

      - name: 결과 파일 모으기
        run: |
          set -e
          D=~/.acme.sh/$DOMAIN
          mkdir -p cert
          cp "$D/$DOMAIN.cer" cert/server.pem
          cp "$D/ca.cer"      cert/chain.pem
          cp "$D/$DOMAIN.key" cert/server.key
          cp "$D/fullchain.cer" cert/fullchain.pem
          # 만료일·발급 대상을 적어 둔다(앱·사람이 눈으로 확인용)
          {
            echo "domain=$DOMAIN"
            echo "san=$(openssl x509 -in cert/server.pem -noout -ext subjectAltName | tail -1 | tr -d ' ')"
            echo "notAfter=$(openssl x509 -in cert/server.pem -noout -enddate | cut -d= -f2)"
            echo "issuer=$(openssl x509 -in cert/server.pem -noout -issuer | sed 's/^issuer=//')"
            echo "issuedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > cert/info.txt
          cat cert/info.txt
          openssl x509 -in cert/server.pem -noout -subject -dates

      - name: 저장소에 올리기
        run: |
          set -e
          git config user.name  "cert bot"
          git config user.email "actions@github.com"
          git add cert
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 올리지 않는다"
          else
            git commit -m "인증서 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
